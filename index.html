<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RenAi - Personal Academic AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #252b3a;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
    }

    header p {
      color: #8d96aa;
      margin-top: 5px;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 15px;
      line-height: 1.5;
    }

    .ai {
      background: #171d2b;
      margin-right: auto;
    }

    .user {
      background: #315bea;
      margin-left: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 20vh;
    }

    .welcome h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #8d96aa;
    }

    .input-area {
      display: flex;
      padding: 12px;
      gap: 8px;
      border-top: 1px solid #252b3a;
      background: #0b0f19;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #30384c;
      background: #141a27;
      color: white;
      outline: none;
    }

    button {
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: #315bea;
      color: white;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <header>
    <h1>RenAi</h1>
    <p>Personal Academic AI</p>
  </header>

  <main id="chat">

    <div class="welcome" id="welcome">
      <h2>👋 Halo!</h2>
      <p>Saya RenAi. Ada tugas yang ingin kamu bahas?</p>
    </div>

  </main>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Tulis pertanyaan..."
    >

    <button onclick="sendMessage()">
      Kirim
    </button>
  </div>

 <script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwG2liWhM9iLIhemMIM9LuEOUb-mJq_3GeJNynbNY8LPX6FjXgn0bRc3wha_6N_eGy4MQ/exec";

  async function sendMessage() {
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    const message = input.value.trim();

    if (!message) return;

    if (welcome) {
      welcome.remove();
    }

    // Pesan user
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = message;
    chat.appendChild(userMessage);

    input.value = "";

    // Pesan loading
    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent = "RenAi sedang berpikir... 🤖";
    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          question: message
        })
      });

      const data = await response.json();

      if (data.success) {
        aiMessage.textContent = data.answer;
      } else {
        aiMessage.textContent =
          "Maaf bro, RenAi mengalami error: " + data.error;
      }

    } catch (error) {
      aiMessage.textContent =
        "Gagal terhubung ke RenAi Backend. Coba lagi.";
      console.error(error);
    }

    chat.scrollTop = chat.scrollHeight;
  }

  document.getElementById("messageInput")
    .addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
</script>

</body>
</html>
